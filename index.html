<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="VLEARN Exam">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold tracking-wide" id="header-title">VLEARN PRACTICE EXAM</h1>
                <p class="text-indigo-200 text-sm" id="header-subtitle">Select an exam to practice</p>
            </div>
            <button id="home-btn" onclick="showPortal()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-lg text-sm border border-indigo-400 transition">
                🏠 시험 목록 (Exam Menu)
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">
        <!-- ==================== VIEW 1: PORTAL / EXAM SELECTION ==================== -->
        <div id="portal-view" class="space-y-6">
            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 text-center">
                <h2 class="text-2xl font-bold text-slate-900 mb-2">VLEARN Practice Exam Portal</h2>
                <p class="text-slate-600 text-sm">Please choose an exam module below to begin testing.</p>
            </div>

            <!-- Exam Cards Container -->
            <div id="exam-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamically populated from JS -->
            </div>
        </div>

        <!-- ==================== VIEW 2: ACTIVE TEST ==================== -->
        <div id="test-view" class="hidden">
            <!-- Info Card -->
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 mb-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 class="font-bold text-lg text-slate-900" id="test-info-title">시험 안내 (Test Instructions)</h2>
                        <p class="text-slate-600 text-sm mt-1" id="test-info-desc">
                            각 문제의 단어나 그래프를 확인하고 알맞은 한국어 번호를 누르세요. <br>
                            <span class="text-slate-500">(Look at the word/graph and tap the correct Korean choice.)</span>
                        </p>
                    </div>
                    <button id="submit-btn" onclick="submitTest()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-lg shadow-md transition duration-200">
                        제출 및 채점하기 (Submit Test)
                    </button>
                </div>
            </div>

            <!-- Results Summary Card -->
            <div id="result-card" class="hidden bg-white rounded-xl p-6 shadow-md border-2 border-indigo-500 mb-8 text-center">
                <h2 class="text-2xl font-bold text-slate-900">시험 결과 (Test Results)</h2>
                <div class="text-5xl font-extrabold text-indigo-600 my-4" id="final-score">0 / 0</div>
                <p id="result-message" class="text-slate-700 font-medium text-lg mb-4"></p>
                <div class="flex justify-center gap-4">
                    <button onclick="resetTest()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-lg transition">
                        다시 풀기 (Restart Test)
                    </button>
                    <button onclick="showPortal()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-5 py-2.5 rounded-lg transition">
                        시험 목록으로 (Exam Menu)
                    </button>
                </div>
            </div>

            <!-- Questions Container -->
            <div id="questions-container" class="space-y-6"></div>

            <!-- Bottom Submit Button -->
            <div class="mt-8 text-center">
                <button id="bottom-submit-btn" onclick="submitTest()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg px-10 py-4 rounded-xl shadow-lg transition duration-200 w-full md:w-auto">
                    제출 및 채점하기 (Submit Test)
                </button>
            </div>
        </div>
    </main>

                    { id: 7, title: "7. 다음은 병원 방문 목적을 나타낸 그래프입니다. 설명으로 맞는 것은 무엇입니까?", topic: "건강과 병원 (Health & Hospital)", chartType: "bar", unit: "%", data: { labels: ['감기', '외상/상처', '건강검진', '치과 치료'], values: [35, 25, 20, 20] }, options: [ "감기로 인한 방문이 가장 많습니다.", "치과 치료가 가장 많습니다.", "건강검진이 외상보다 많습니다.", "외상/상처 방문이 40% 이상입니다." ], answer: 0, explanation: "감기가 35%로 병원 방문 목적 중 가장 많습니다." },

                    optionsHtml += `
                        <button onclick="selectOption(${qId}, ${optIndex})" id="q${qId}-opt${optIndex}" class="w-full text-left px-4 py-3 rounded-lg border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition flex items-center space-x-3 text-slate-700">
                            <span class="w-7 h-7 rounded-full bg-slate-100 text-slate-600 font-bold text-sm flex items-center justify-center shrink-0 border border-slate-300" id="q${qId}-num${optIndex}">${optIndex + 1}</span>
                            <span class="text-base font-medium">${opt}</span>
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold px-2.5 py-0.5 rounded bg-slate-100 text-slate-600">${qTopic}</span>
                        <span class="text-xs text-slate-400">Q${qId}</span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-2">${qTitle}</h3>
                    ${visualContent}
                    <div class="space-y-2.5 mt-4">
                        ${optionsHtml}
                    </div>
                    <div id="explanation-${qId}" class="hidden mt-4 p-4 rounded-lg bg-indigo-50 border border-indigo-200 text-sm text-indigo-900">
                        <p class="font-bold mb-1">💡 해설 (Explanation):</p>
                        <p>${qExplanation}</p>
                    </div>
                `;

                container.appendChild(card);

                if (q.chartType) {
                    setTimeout(() => renderChart(q, qId), 50);
                }
            });
        }

        function renderChart(q, qId) {
            const ctx = document.getElementById(`chart-${qId}`);
            if (!ctx) return;

            const chartConfig = {
                type: q.chartType,
                data: {
                    labels: q.data.labels,
                    datasets: [{
                        label: q.unit,
                        data: q.data.values,
                        backgroundColor: q.chartType === 'pie' 
                            ? ['#6366f1', '#3b82f6', '#10b981', '#f59e0b', '#ec4899']
                            : '#6366f1',
                        borderColor: q.chartType === 'line' ? '#4f46e5' : '#ffffff',
                        borderWidth: 2,
                        fill: q.chartType === 'line' ? false : true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: q.chartType === 'pie',
                            position: 'bottom'
                        },
                        datalabels: {
                            color: q.chartType === 'pie' ? '#fff' : '#1e293b',
                            font: { weight: 'bold' },
                            formatter: (value) => `${value}${q.unit}`
                        }
                    }
                }
            };

            const newChart = new Chart(ctx, chartConfig);
            activeCharts.push(newChart);
        }

        function selectOption(qId, optionIndex) {
            userAnswers[qId] = optionIndex;
            const exam = window.allExams[currentExamId];

            exam.questions.forEach((q, index) => {
                const currentQId = q.id !== undefined ? q.id : (index + 1);
                if (currentQId === qId) {
                    q.options.forEach((_, idx) => {
                        const btn = document.getElementById(`q${qId}-opt${idx}`);
                        const num = document.getElementById(`q${qId}-num${idx}`);
                        if (idx === optionIndex) {
                            btn.className = "w-full text-left px-4 py-3 rounded-lg border-2 border-indigo-600 bg-indigo-50 transition flex items-center space-x-3 text-indigo-900 font-semibold";
                            num.className = "w-7 h-7 rounded-full bg-indigo-600 text-white font-bold text-sm flex items-center justify-center shrink-0 border border-indigo-600";
                        } else {
                            btn.className = "w-full text-left px-4 py-3 rounded-lg border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition flex items-center space-x-3 text-slate-700";
                            num.className = "w-7 h-7 rounded-full bg-slate-100 text-slate-600 font-bold text-sm flex items-center justify-center shrink-0 border border-slate-300";
                        }
                    });
                }
            });
        }

        function submitTest() {
            const exam = window.allExams[currentExamId];
            let score = 0;

            exam.questions.forEach((q, index) => {
                const qId = q.id !== undefined ? q.id : (index + 1);
                const selectedOpt = userAnswers[qId];
                const expDiv = document.getElementById(`explanation-${qId}`);
                expDiv.classList.remove('hidden');

                q.options.forEach((_, idx) => {
                    const btn = document.getElementById(`q${qId}-opt${idx}`);
                    btn.disabled = true;

                    if (idx === q.answer) {
                        btn.className = "w-full text-left px-4 py-3 rounded-lg border-2 border-emerald-500 bg-emerald-50 transition flex items-center space-x-3 text-emerald-900 font-semibold";
                    } else if (idx === selectedOpt && selectedOpt !== q.answer) {
                        btn.className = "w-full text-left px-4 py-3 rounded-lg border-2 border-rose-500 bg-rose-50 transition flex items-center space-x-3 text-rose-900 font-semibold";
                    }
                });

                if (selectedOpt === q.answer) {
                    score++;
                }
            });

            const total = exam.questions.length;
            const scorePercent = Math.round((score / total) * 100);

            const resultCard = document.getElementById('result-card');
            const scoreText = document.getElementById('final-score');
            const msgText = document.getElementById('result-message');

            scoreText.innerText = `${score} / ${total} (${scorePercent}%)`;
            if (scorePercent >= 80) {
                msgText.innerText = "🎉 합격 수준입니다! 아주 훌륭합니다! (Excellent job!)";
                msgText.className = "text-emerald-600 font-bold text-lg mb-4";
            } else if (scorePercent >= 60) {
                msgText.innerText = "👍 잘 하셨습니다. 조금만 더 연습해보세요! (Good effort!)";
                msgText.className = "text-indigo-600 font-bold text-lg mb-4";
            } else {
                msgText.innerText = "💪 아쉽네요. 틀린 내용을 복습해보세요! (Keep practicing!)";
                msgText.className = "text-rose-600 font-bold text-lg mb-4";
            }

            resultCard.classList.remove('hidden');
            resultCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetTest() {
            userAnswers = {};
            document.getElementById('result-card').classList.add('hidden');
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
